# =============================================================================
# Flux RSS analysés par Contrepoint
# =============================================================================
# Chaque flux appartient à un groupe :
#   - marche : actualité financière et économique générale (anglais) ;
#   - esg    : actualité de la finance durable / ESG (anglais).
# Pour désactiver un flux : actif: false. Pour en ajouter un : copier un bloc.
# type: direct      → flux publié par le média lui-même ;
# type: agregateur  → recherche Google Actualités (reprend d'autres médias).
#   Les articles d'agrégateur sont dédoublonnés par rapport aux flux directs :
#   si le même article existe déjà dans un flux direct, on garde le direct.
#
# Tous ces flux ont été testés le 17/10/2026 (nombre d'articles, présence d'un
# résumé, fraîcheur). Les flux écartés et leur raison sont listés en bas.
# =============================================================================

# Interrupteur général des agrégateurs (Google Actualités).
agregateurs_actifs: true

# Filtre des agrégateurs : Google Actualités retient un article dès que le mot
# cherché apparaît quelque part dans son texte. Constaté le 17/10/2026 : 43 %
# des titres obtenus n'avaient aucun rapport visible avec l'ESG. On ne garde
# donc un article d'agrégateur que si son TITRE contient au moins un de ces
# mots-clés (mot entier). Une étoile * signifie « suivi de n'importe quelles
# lettres » : sustainab* couvre sustainable, sustainability…
# Majuscules : indifférentes (green = Green = GREEN), SAUF pour les sigles écrits
# tout en majuscules ici (ESG, SRI, COP…), qui doivent l'être aussi dans le titre
# (sinon « cop », le policier, passerait pour la conférence climat COP).
# Les flux spécialisés (type: direct) ne sont pas filtrés.
mots_cles_agregateurs:
  esg:
    - ESG
    - SRI
    - sustainab*
    - climate
    - carbon
    - decarboni*
    - emission*
    - net zero
    - net-zero
    - green               # mot entier : « greenback » (le dollar) n'est pas retenu
    - greenwash*
    - renewable*
    - clean energy
    - solar
    - wind power
    - wind farm*
    - transition
    - biodiversity
    - deforestation
    - methane
    - fossil
    - Paris Agreement
    - COP                 # conférences climat de l'ONU : « COP », « COP30 », « COP31 »…
    - COP2*
    - COP3*
    - taxonomy
    - SFDR
    - CSRD
    - ISSB
    - TCFD
    - impact invest*
    - responsible invest*
    - ethical
    - stewardship
    - proxy vot*
    - shareholder resolution*
    - social bond*
    - governance
    - human rights
    - diversity

# media : nom du média, utilisé pour mesurer le poids de chaque média dans un
# groupe (CNBC a 5 flux mais reste UN média). Pour Google Actualités, le média
# est celui de chaque article (indiqué par Google).
flux:
  # --- Groupe « marché » -------------------------------------------------------
  - { groupe: marche, nom: CNBC Top News,        media: "CNBC", type: direct, actif: true, url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
  - { groupe: marche, nom: CNBC Finance,         media: "CNBC", type: direct, actif: true, url: "https://www.cnbc.com/id/10000664/device/rss/rss.html" }
  - { groupe: marche, nom: CNBC Economy,         media: "CNBC", type: direct, actif: true, url: "https://www.cnbc.com/id/20910258/device/rss/rss.html" }
  - { groupe: marche, nom: CNBC Investing,       media: "CNBC", type: direct, actif: true, url: "https://www.cnbc.com/id/15839069/device/rss/rss.html" }
  - { groupe: marche, nom: CNBC Europe,          media: "CNBC", type: direct, actif: true, url: "https://www.cnbc.com/id/19794221/device/rss/rss.html" }
  - { groupe: marche, nom: WSJ Markets,          media: "Wall Street Journal", type: direct, actif: true, url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain" }
  - { groupe: marche, nom: WSJ Economy,          media: "Wall Street Journal", type: direct, actif: true, url: "https://feeds.content.dowjones.io/public/rss/socialeconomyfeed" }
  - { groupe: marche, nom: FT Markets,           media: "Financial Times", type: direct, actif: true, url: "https://www.ft.com/markets?format=rss" }
  - { groupe: marche, nom: FT Global Economy,    media: "Financial Times", type: direct, actif: true, url: "https://www.ft.com/global-economy?format=rss" }
  - { groupe: marche, nom: Bloomberg Markets,    media: "Bloomberg", type: direct, actif: true, url: "https://feeds.bloomberg.com/markets/news.rss" }
  - { groupe: marche, nom: Bloomberg Economics,  media: "Bloomberg", type: direct, actif: true, url: "https://feeds.bloomberg.com/economics/news.rss" }
  - { groupe: marche, nom: BBC Business,         media: "BBC", type: direct, actif: true, url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
  - { groupe: marche, nom: Guardian Business,    media: "The Guardian", type: direct, actif: true, url: "https://www.theguardian.com/business/rss" }
  - { groupe: marche, nom: Guardian Economics,   media: "The Guardian", type: direct, actif: true, url: "https://www.theguardian.com/business/economics/rss" }
  - { groupe: marche, nom: NYT Business,         media: "New York Times", type: direct, actif: true, url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml" }
  - { groupe: marche, nom: NYT Economy,          media: "New York Times", type: direct, actif: true, url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml" }
  - { groupe: marche, nom: Euronews Business,    media: "Euronews", type: direct, actif: true, url: "https://www.euronews.com/rss?level=vertical&name=business" }
  - { groupe: marche, nom: DW Business,          media: "Deutsche Welle", type: direct, actif: true, url: "https://rss.dw.com/rdf/rss-en-bus" }

  # --- Groupe « ESG / finance durable » ------------------------------------------
  - { groupe: esg, nom: ESG Today,               media: "ESG Today", type: direct, actif: true, url: "https://www.esgtoday.com/feed/" }
  - { groupe: esg, nom: ESG Dive,                media: "ESG Dive", type: direct, actif: true, url: "https://www.esgdive.com/feeds/news/" }
  - { groupe: esg, nom: ESG News,                media: "ESG News", type: direct, actif: true, url: "https://esgnews.com/feed/" }
  - { groupe: esg, nom: Responsible Investor,    media: "Responsible Investor", type: direct, actif: true, url: "https://www.responsible-investor.com/feed/" }
  # ImpactAlpha : fonctionne depuis un ordinateur personnel, mais refuse les serveurs
  # de GitHub (erreur 403 constatée le 17/10/2026) → désactivé.
  - { groupe: esg, nom: ImpactAlpha,             media: "ImpactAlpha", type: direct, actif: false, url: "https://impactalpha.com/feed/" }
  - { groupe: esg, nom: Trellis,                 media: "Trellis", type: direct, actif: true, url: "https://trellis.net/feed/" }
  - { groupe: esg, nom: FT Moral Money,          media: "Financial Times", type: direct, actif: true, url: "https://www.ft.com/moral-money?format=rss" }
  - { groupe: esg, nom: FT Climate Capital,      media: "Financial Times", type: direct, actif: true, url: "https://www.ft.com/climate-capital?format=rss" }
  - { groupe: esg, nom: Edie,                    media: "Edie", type: direct, actif: true, url: "https://www.edie.net/feed/" }
  - { groupe: esg, nom: GreenMoney,              media: "GreenMoney", type: direct, actif: true, url: "https://greenmoney.com/feed/" }
  - { groupe: esg, nom: TriplePundit,            media: "TriplePundit", type: direct, actif: true, url: "https://www.triplepundit.com/feed" }
  - { groupe: esg, nom: "Google Actualités : ESG investing",      media: "(selon l'article)", type: agregateur, actif: true, url: "https://news.google.com/rss/search?q=ESG+investing+when:1d&hl=en-US&gl=US&ceid=US:en" }
  - { groupe: esg, nom: "Google Actualités : sustainable finance", media: "(selon l'article)", type: agregateur, actif: true, url: "https://news.google.com/rss/search?q=%22sustainable+finance%22+when:1d&hl=en-US&gl=US&ceid=US:en" }

# Flux testés et écartés (17/10/2026) :
# - Yahoo Finance, Fortune, Bloomberg Green, IPE ESG, Sustainable Brands : flux morts (erreur 404)
# - Environmental Finance : accès refusé (403) ; UN PRI : connexion coupée
# - Investing.com, Seeking Alpha : pas de résumé et renouvellement trop rapide
# - MarketWatch, Nasdaq, Business Insider : 10 à 15 articles couvrant 1 à 2 h seulement
# - Fed, BCE : communiqués officiels, pas de la presse
# - Carbon Brief, Inside Climate News, Climate Home, Guardian Climat : actualité
#   climatique et non finance durable (une canicule serait classée « négative »)
