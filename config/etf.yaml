      - "Fiche iShares (factsheet) SWDA, données au 30/09/2026 : https://www.ishares.com/ch/professionals/en/literature/fact-sheet/swda-ishares-core-msci-world-ucits-etf-fund-fact-sheet-en-ch.pdf"
