# =============================================================================
# Liste des ETF comparés par Contrepoint
# =============================================================================
# Ce fichier contient deux types d'informations :
#   1. techniques : code Yahoo, place de cotation, devise (servent au calcul) ;
#   2. réglementaires et ESG : SFDR, labels, frais, note MSCI. Ces données sont
#      STATIQUES : elles sont relevées à la main dans les documents officiels,
#      avec leur source et leur date de vérification.
#
# ⚠️ À METTRE À JOUR À LA MAIN (voir le README) :
#   - les notes MSCI ESG changent environ chaque mois ;
#   - la liste du label ISR est publiée chaque mois ;
#   - la classification SFDR et les frais peuvent changer.
# =============================================================================

reference: msci_world   # identifiant de l'ETF qui sert de point de comparaison
defaut_esg: sri         # ETF ESG affiché par défaut sur le site

etf:
