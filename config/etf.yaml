  # ---------------------------------------------------------------------------
  - id: paris
    nom_court: World Paris-Aligned
    nom: iShares MSCI World Paris-Aligned Climate UCITS ETF (Acc)
    role: esg_climat
    approche: Climat (aligné sur l'accord de Paris)
    vue_principale: true
    isin: IE00BMXC7W70
    ticker_yahoo: WPAB.DE
    place: Xetra (Francfort)
    devise_cotation: EUR
    # Raccordement : la cotation en euros sur Xetra n'existe sur Yahoo que depuis
    # le 25/08/2025. Avant cette date, on utilise la cotation en dollars
    # d'Amsterdam, convertie au taux BCE. Mesuré le 17/10/2026 : cette cotation
    # est peu échangée et bruitée (écart de suivi 5,9 % contre 2,0 % en direct),
    # d'où le choix de ne l'utiliser que pour l'historique ancien.
    # Pour revenir à la cotation d'Amsterdam seule : supprimer ce bloc et
    # remettre ticker_yahoo: WPAB.AS et devise_cotation: USD.
    historique_avant:
      ticker_yahoo: WPAB.AS
      place: Euronext Amsterdam
      devise_cotation: USD
    indice: MSCI World Climate Paris Aligned Benchmark Select Index
    emetteur: iShares (BlackRock)
    replication: Physique (complète)
    distribution: Capitalisation
    lancement_part: 2021-04-22
    frais_annuels_pct: 0.20
    sfdr: Article 8
    labels: []
    composition_csv: https://www.ishares.com/uk/individual/en/products/318383/ishares-msci-world-paris-aligned-climate-ucits-etf/latest-holdings.csv
    note_msci:
      note: A
      score_qualite: 7.03
      percentile_pairs: 54.17
      date: 2026-09-18
      source: "Fiche iShares WPAB (factsheet), section « ESG Metrics » : https://www.blackrock.com/gls-download/literature/fact-sheet/wpab-ishares-msci-world-paris-aligned-climate-ucits-etf-fund-fact-sheet-en-no.pdf"
