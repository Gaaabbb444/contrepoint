    nom_court: MSCI World
    nom: iShares Core MSCI World UCITS ETF (Acc)
    role: reference            # reference | esg_large | esg_strict | esg_climat | complement
    approche: Référence (marché classique)
    vue_principale: true
    isin: IE00B4L5Y983
    ticker_yahoo: EUNL.DE
    place: Xetra (Francfort)
    devise_cotation: EUR
    indice: MSCI World Index (Net)
    emetteur: iShares (BlackRock)
    replication: Physique (optimisée)
    distribution: Capitalisation
    lancement_part: 2009-09-25
    frais_annuels_pct: 0.20
    sfdr: Autre (article 6)      # mention exacte de la fiche : « SFDR Classification : Other »
